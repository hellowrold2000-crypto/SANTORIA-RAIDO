<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Santoria · Radio Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07090f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 0.8rem;
      user-select: none;
      background: radial-gradient(ellipse at 30% 20%, #1a1f3a, #03050b 80%);
      touch-action: manipulation;
    }
    .santoria-panel {
      max-width: 820px;
      width: 100%;
      background: rgba(12, 16, 30, 0.75);
      backdrop-filter: blur(32px) saturate(240%);
      -webkit-backdrop-filter: blur(32px) saturate(240%);
      border-radius: 3.2rem;
      padding: 1.8rem 1.6rem 2rem 1.6rem;
      box-shadow: 0 60px 100px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    .santoria-panel::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle at 70% 30%, rgba(120, 90, 255, 0.06), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .santoria-content { position: relative; z-index: 2; }

    /* HEADER */
    .santoria-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .santoria-header .brand {
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e8e0ff, #b8a8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .santoria-header .brand i {
      font-size: 1.1rem;
      color: #b098f0;
      background: rgba(150, 120, 240, 0.1);
      padding: 6px 8px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .santoria-header .status-badge {
      background: rgba(160, 140, 255, 0.06);
      padding: 0.3rem 1rem;
      border-radius: 60px;
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #b0a0e8;
      border: 1px solid rgba(160, 140, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .santoria-header .status-badge i { font-size: 0.4rem; color: #8a7ae0; }

    /* TRACK AREA */
    .track-area {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .cover-art {
      width: 80px;
      height: 80px;
      min-width: 80px;
      background: linear-gradient(145deg, #1e2440, #0a0e1e);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      color: #b09aff;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.02);
      position: relative;
    }
    .cover-art::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 28px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(180, 150, 255, 0.1), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .cover-art i { filter: drop-shadow(0 8px 20px rgba(100, 80, 200, 0.15)); }
    .track-info { flex: 1; min-width: 0; }
    .track-info .track-name {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #f0ecff, #c8bcff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name {
      font-size: 0.85rem;
      font-weight: 300;
      color: #8a92b8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-info .artist-name i { font-size: 0.4rem; color: #6a7a9a; }

    /* VISUALIZER */
    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 44px;
      margin: 0.4rem 0 1.2rem 0;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 60px;
      padding: 0.3rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .visualizer .bar {
      width: 5px;
      height: 16px;
      background: linear-gradient(to top, #6a5ac0, #b09aff);
      border-radius: 10px;
      animation: pulseBar 1.1s infinite alternate ease-in-out;
      transform-origin: bottom;
      opacity: 0.6;
    }
    .visualizer .bar:nth-child(1) { animation-duration: 0.9s; height: 18px; }
    .visualizer .bar:nth-child(2) { animation-duration: 1.3s; height: 30px; }
    .visualizer .bar:nth-child(3) { animation-duration: 0.7s; height: 22px; }
    .visualizer .bar:nth-child(4) { animation-duration: 1.5s; height: 36px; }
    .visualizer .bar:nth-child(5) { animation-duration: 1.0s; height: 26px; }
    .visualizer .bar:nth-child(6) { animation-duration: 1.8s; height: 40px; }
    .visualizer .bar:nth-child(7) { animation-duration: 0.8s; height: 18px; }
    .visualizer .bar:nth-child(8) { animation-duration: 1.2s; height: 32px; }
    .visualizer .bar:nth-child(9) { animation-duration: 1.0s; height: 22px; }
    .visualizer .bar:nth-child(10) { animation-duration: 1.4s; height: 36px; }
    @keyframes pulseBar {
      0% { transform: scaleY(0.2); opacity: 0.3; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }

    /* PROGRESS */
    .progress-container {
      margin: 0.8rem 0 0.3rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      touch-action: none;
      transition: height 0.15s ease;
    }
    .progress-bar:hover { height: 6px; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #8a7af0, #c2b0ff);
      border-radius: 10px;
      transition: width 0.1s linear;
      box-shadow: 0 0 20px rgba(138, 122, 240, 0.15);
    }
    .time-display {
      font-size: 0.65rem;
      color: #6a7498;
      font-weight: 400;
      letter-spacing: 0.5px;
      min-width: 60px;
      text-align: center;
    }

    /* CONTROLS - Enhanced */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin: 1.4rem 0 0.2rem 0;
    }
    .controls button {
      background: rgba(30, 36, 58, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.03);
      color: #8d96bd;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .controls button::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      padding: 1px;
      background: linear-gradient(135deg, rgba(180, 150, 255, 0.05), transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .controls button:hover {
      background: rgba(50, 60, 100, 0.3);
      border-color: rgba(180, 150, 255, 0.08);
      color: #c8bfff;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .controls button:active {
      transform: scale(0.88);
      background: rgba(40, 48, 80, 0.4);
    }
    .controls button.play-btn {
      background: linear-gradient(145deg, #3d3470, #241f47);
      border-color: rgba(180, 150, 255, 0.08);
      color: #ddd2ff;
      width: 68px;
      height: 68px;
      font-size: 1.8rem;
      box-shadow: 0 8px 32px rgba(70, 50, 180, 0.2);
    }
    .controls button.play-btn::before {
      background: linear-gradient(135deg, rgba(200, 180, 255, 0.15), transparent 70%);
    }
    .controls button.play-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 40px rgba(70, 50, 180, 0.3);
    }
    .controls button.play-btn:active { transform: scale(0.88); }
    .controls button.active {
      color: #b09aff;
      border-color: rgba(180, 150, 255, 0.12);
      background: rgba(100, 80, 200, 0.08);
    }
    .controls button.active::before {
      background: linear-gradient(135deg, rgba(180, 150, 255, 0.15), transparent 70%);
    }

    /* VOLUME */
    .volume-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 0.8rem;
      padding: 0.3rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .volume-container i {
      color: #6a7498;
      font-size: 0.8rem;
    }
    .volume-container input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      outline: none;
      transition: background 0.2s;
    }
    .volume-container input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #b09aff, #8a7af0);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(138, 122, 240, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.05);
    }
    .volume-container input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #8a7af0;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.05);
    }
    .volume-container #muteBtn {
      background: none;
      border: none;
      color: #6a7498;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 50%;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .volume-container #muteBtn:hover { color: #b09aff; background: rgba(100, 80, 200, 0.06); }
    .volume-container #muteBtn:active { transform: scale(0.85); }

    /* FOOTER */
    .santoria-footer {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.5rem;
      letter-spacing: 1.2px;
      color: #3f4870;
      border-top: 1px solid rgba(255, 255, 255, 0.015);
      padding-top: 0.8rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      text-transform: uppercase;
      flex-wrap: wrap;
    }
    .santoria-footer span i {
      margin-right: 4px;
      color: #5b6692;
      font-size: 0.45rem;
    }
    ::selection { background: transparent; }
    ::-moz-selection { background: transparent; }
    audio {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
    }

    /* RESPONSIVE */
    @media (min-width: 600px) {
      .santoria-panel { padding: 2.8rem 2.6rem 2.6rem 2.6rem; border-radius: 4.2rem; }
      .cover-art { width: 120px; height: 120px; min-width: 120px; font-size: 3.6rem; }
      .track-info .track-name { font-size: 2.2rem; white-space: normal; }
      .track-info .artist-name { font-size: 1rem; white-space: normal; }
      .controls button { width: 58px; height: 58px; font-size: 1.4rem; }
      .controls button.play-btn { width: 78px; height: 78px; font-size: 2.2rem; }
      .volume-container input[type="range"] { width: 140px; }
      .santoria-header .brand { font-size: 1.6rem; }
      .santoria-header .status-badge { font-size: 0.65rem; padding: 0.4rem 1.4rem; }
      .visualizer { height: 56px; gap: 6px; }
      .visualizer .bar { width: 6px; height: 18px; }
      .visualizer .bar:nth-child(1) { height: 22px; }
      .visualizer .bar:nth-child(2) { height: 36px; }
      .visualizer .bar:nth-child(3) { height: 28px; }
      .visualizer .bar:nth-child(4) { height: 44px; }
      .visualizer .bar:nth-child(5) { height: 30px; }
      .visualizer .bar:nth-child(6) { height: 48px; }
      .visualizer .bar:nth-child(7) { height: 20px; }
      .visualizer .bar:nth-child(8) { height: 38px; }
      .visualizer .bar:nth-child(9) { height: 26px; }
      .visualizer .bar:nth-child(10) { height: 42px; }
      .time-display { font-size: 0.7rem; min-width: 70px; }
      .santoria-footer { font-size: 0.6rem; }
      .santoria-header .brand i { font-size: 1.4rem; padding: 8px 10px; }
    }
    @media (max-width: 400px) {
      .controls button { width: 40px; height: 40px; font-size: 1rem; }
      .controls button.play-btn { width: 58px; height: 58px; font-size: 1.5rem; }
      .cover-art { width: 60px; height: 60px; min-width: 60px; font-size: 1.8rem; }
      .track-info .track-name { font-size: 1.1rem; }
      .track-info .artist-name { font-size: 0.7rem; }
      .volume-container input[type="range"] { width: 70px; }
      .santoria-panel { padding: 1.2rem 1rem 1.5rem 1rem; border-radius: 2.4rem; }
      .visualizer { height: 36px; gap: 4px; padding: 0.3rem 1rem; }
      .visualizer .bar { width: 4px; height: 14px; }
      .santoria-header .brand { font-size: 1rem; }
      .santoria-header .status-badge { font-size: 0.45rem; padding: 0.2rem 0.6rem; }
    }
  </style>
</head>
<body>

  <div class="santoria-panel">
    <div class="santoria-content">

      <!-- HEADER -->
      <div class="santoria-header">
        <div class="brand">
          <i class="fas fa-crown"></i> Santoria
        </div>
        <div class="status-badge" id="statusBadge">
          <i class="fas fa-circle"></i> live · radio
        </div>
      </div>

      <!-- TRACK INFO -->
      <div class="track-area">
        <div class="cover-art">
          <i class="fas fa-record-vinyl"></i>
        </div>
        <div class="track-info">
          <div class="track-name" id="trackName">Silk & Gold</div>
          <div class="artist-name">
            <i class="fas fa-asterisk"></i> <span id="artistName">Santoria studio · exclusive</span>
          </div>
        </div>
      </div>

      <!-- VISUALIZER -->
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>

      <!-- PROGRESS -->
      <div class="progress-container">
        <span class="time-display" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-display" id="totalTime">0:00</span>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button id="shuffleBtn" title="Shuffle"><i class="fas fa-shuffle"></i></button>
        <button id="prevBtn" title="Previous"><i class="fas fa-backward-step"></i></button>
        <button class="play-btn" id="playBtn"><i class="fas fa-play"></i></button>
        <button id="nextBtn" title="Next"><i class="fas fa-forward-step"></i></button>
        <button id="loopBtn" title="Loop"><i class="fas fa-repeat"></i></button>
      </div>

      <!-- VOLUME -->
      <div class="volume-container">
        <i class="fas fa-volume-low"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
        <i class="fas fa-volume-high"></i>
        <button id="muteBtn" title="Mute"><i class="fas fa-volume-up"></i></button>
      </div>

      <!-- FOOTER -->
      <div class="santoria-footer">
        <span><i class="fas fa-radio"></i> fm · santoria</span>
        <span><i class="fas fa-waveform"></i> always on</span>
        <span><i class="fas fa-crown"></i> maison santoria</span>
      </div>
    </div>
  </div>

  <audio id="santoriaAudio" preload="auto"></audio>

  <script>
    (function() {
      // ----- ELEMENTS -----
      const audio = document.getElementById('santoriaAudio');
      const playBtn = document.getElementById('playBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const loopBtn = document.getElementById('loopBtn');
      const muteBtn = document.getElementById('muteBtn');
      const volumeSlider = document.getElementById('volumeSlider');
      const progressFill = document.getElementById('progressFill');
      const progressBar = document.getElementById('progressBar');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const trackNameEl = document.getElementById('trackName');
      const artistNameEl = document.getElementById('artistName');
      const statusBadge = document.getElementById('statusBadge');

      // ----- PLAYLIST -----
      const playlist = [
        {
          src: "https://files.catbox.moe/zlf4uh.mp3",
          name: "سورة البقرة",
          artist: "Santoria studio"
        },
        {
          src: "https://files.catbox.moe/ozwroe.mp3",
          name: "Morning Vibes",
          artist: "Santoria studio"
        },
        {
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
          name: "Crystal Dreams",
          artist: "Santoria studio"
        },
        {
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
          name: "Golden Hour",
          artist: "Santoria studio"
        },
        {
          src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
          name: "Midnight Breeze",
          artist: "Santoria studio"
        }
      ];

      let currentTrackIndex = 0;
      let isPlaying = false;
      let isShuffled = false;
      let loopMode = 'none';
      let shuffleQueue = [];
      let shuffleIndex = 0;

      // ----- FORMAT TIME -----
      function formatTime(seconds) {
        if (isNaN(seconds) || seconds === Infinity) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      // ----- LOAD TRACK -----
      function loadTrack(index) {
        let track;
        if (isShuffled && shuffleQueue.length > 0) {
          track = playlist[shuffleQueue[index]];
        } else {
          track = playlist[index];
        }
        if (!track) return;
        audio.src = track.src;
        audio.load();
        trackNameEl.textContent = track.name;
        artistNameEl.textContent = track.artist;
        progressFill.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        audio.addEventListener('loadedmetadata', function onMetadata() {
          totalTimeEl.textContent = formatTime(audio.duration);
          audio.removeEventListener('loadedmetadata', onMetadata);
        });
        updateStatusBadge();
      }

      // ----- GET CURRENT TRACK -----
      function getCurrentTrack() {
        if (isShuffled && shuffleQueue.length > 0) {
          return playlist[shuffleQueue[shuffleIndex]];
        }
        return playlist[currentTrackIndex];
      }

      // ----- UPDATE STATUS BADGE -----
      function updateStatusBadge() {
        const track = getCurrentTrack();
        if (track) {
          statusBadge.innerHTML = `<i class="fas fa-circle"></i> ${track.name} · radio`;
        }
      }

      // ----- TOGGLE PLAY/PAUSE -----
      function togglePlay() {
        if (playlist.length === 0) return;

        if (audio.paused) {
          if (!audio.src || audio.ended) {
            if (isShuffled && shuffleQueue.length === 0) generateShuffleQueue();
            loadTrack(isShuffled ? shuffleIndex : currentTrackIndex);
          }
          audio.play().then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.style.color = '#b09aff';
          }).catch(() => {});
        } else {
          audio.pause();
          isPlaying = false;
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.style.color = '#ddd2ff';
        }
      }

      // ----- PLAY NEXT -----
      function playNext() {
        if (playlist.length === 0) return;
        if (isShuffled) {
          shuffleIndex = (shuffleIndex + 1) % shuffleQueue.length;
          loadTrack(shuffleIndex);
        } else {
          currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
          loadTrack(currentTrackIndex);
        }
        if (isPlaying || !audio.paused) audio.play().catch(() => {});
      }

      // ----- PLAY PREVIOUS -----
      function playPrev() {
        if (playlist.length === 0) return;
        if (isShuffled) {
          shuffleIndex = (shuffleIndex - 1 + shuffleQueue.length) % shuffleQueue.length;
          loadTrack(shuffleIndex);
        } else {
          currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
          loadTrack(currentTrackIndex);
        }
        if (isPlaying || !audio.paused) audio.play().catch(() => {});
      }

      // ----- GENERATE SHUFFLE QUEUE -----
      function generateShuffleQueue() {
        shuffleQueue = playlist.map((_, i) => i);
        for (let i = shuffleQueue.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
        }
        shuffleIndex = 0;
      }

      // ----- TOGGLE SHUFFLE -----
      function toggleShuffle() {
        isShuffled = !isShuffled;
        shuffleBtn.classList.toggle('active', isShuffled);
        if (isShuffled) {
          generateShuffleQueue();
          loadTrack(shuffleIndex);
        } else {
          loadTrack(currentTrackIndex);
        }
        if (isPlaying) audio.play().catch(() => {});
      }

      // ----- TOGGLE LOOP -----
      function toggleLoop() {
        const modes = ['none', 'all', 'one'];
        const currentIndex = modes.indexOf(loopMode);
        loopMode = modes[(currentIndex + 1) % modes.length];
        switch(loopMode) {
          case 'none':
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
            loopBtn.style.color = '#8d96bd';
            loopBtn.classList.remove('active');
            break;
          case 'all':
            loopBtn.innerHTML = '<i class="fas fa-repeat"></i>';
            loopBtn.style.color = '#b09aff';
            loopBtn.classList.add('active');
            break;
          case 'one':
            loopBtn.innerHTML = '<i class="fas fa-repeat-1"></i>';
            loopBtn.style.color = '#b09aff';
            loopBtn.classList.add('active');
            break;
        }
      }

      // ----- UPDATE PROGRESS -----
      function updateProgress() {
        if (audio.duration && !isNaN(audio.duration)) {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressFill.style.width = percent + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      }

      // ----- SEEK -----
      function seek(e) {
        const rect = progressBar.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = x * audio.duration;
      }

      // ----- VOLUME -----
      function setVolume(value) {
        audio.volume = parseFloat(value);
        volumeSlider.value = value;
        updateMuteIcon();
      }
      function updateMuteIcon() {
        const vol = audio.volume;
        const muted = audio.muted;
        if (muted || vol === 0) muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        else if (vol < 0.5) muteBtn.innerHTML = '<i class="fas fa-volume-low"></i>';
        else muteBtn.innerHTML = '<i class="fas fa-volume-high"></i>';
      }
      function toggleMute() {
        audio.muted = !audio.muted;
        updateMuteIcon();
      }

      // ----- EVENT LISTENERS -----
      playBtn.addEventListener('click', e => { e.preventDefault(); togglePlay(); });
      nextBtn.addEventListener('click', e => { e.preventDefault(); playNext(); });
      prevBtn.addEventListener('click', e => { e.preventDefault(); playPrev(); });
      shuffleBtn.addEventListener('click', e => { e.preventDefault(); toggleShuffle(); });
      loopBtn.addEventListener('click', e => { e.preventDefault(); toggleLoop(); });
      muteBtn.addEventListener('click', e => { e.preventDefault(); toggleMute(); });
      volumeSlider.addEventListener('input', e => setVolume(e.target.value));
      progressBar.addEventListener('click', seek);
      audio.addEventListener('timeupdate', updateProgress);

      // ----- WHEN SONG ENDS -----
      audio.addEventListener('ended', function() {
        if (loopMode === 'one') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
          return;
        }
        if (isShuffled) {
          shuffleIndex = (shuffleIndex + 1) % shuffleQueue.length;
          loadTrack(shuffleIndex);
        } else {
          currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
          loadTrack(currentTrackIndex);
        }
        if (loopMode === 'all' || isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            playBtn.style.color = '#b09aff';
          }).catch(() => {});
        } else {
          isPlaying = false;
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
          playBtn.style.color = '#ddd2ff';
        }
      });

      // ----- LOAD FIRST TRACK -----
      if (playlist.length > 0) { loadTrack(0); setVolume(0.8); }

      // ----- BLOCK RIGHT-CLICK -----
      document.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, true);

      // ----- KEYBOARD SHORTCUTS -----
      document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Space' || e.key === 'MediaPlayPause') {
          e.preventDefault(); togglePlay(); return false;
        }
        if (e.key === 'ArrowRight' || e.key === 'MediaTrackNext') {
          e.preventDefault(); playNext(); return false;
        }
        if (e.key === 'ArrowLeft' || e.key === 'MediaTrackPrevious') {
          e.preventDefault(); playPrev(); return false;
        }
        if (e.key === 'm' || e.key === 'M') {
          e.preventDefault(); toggleMute(); return false;
        }
      }, true);

      console.log('Santoria Radio · Playlist loaded with ' + playlist.length + ' songs.');
    })();
  </script>

</body>
